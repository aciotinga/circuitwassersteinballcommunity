<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Circuit Wasserstein Ball Community</title>
    <style>
      :root {
        --bg: #0f1419;
        --fg: #e8eef4;
        --muted: #9aa8b5;
        --accent: #3d9cf0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--fg);
        background:
          radial-gradient(ellipse at 20% 10%, #1a3a5c 0%, transparent 50%),
          radial-gradient(ellipse at 80% 90%, #1e2a40 0%, transparent 45%),
          var(--bg);
      }

      main {
        text-align: center;
        padding: 2rem;
        max-width: 36rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.125rem;
        line-height: 1.5;
      }

      .status {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.4rem 0.9rem;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
        color: var(--accent);
        border-radius: 999px;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Circuit Wasserstein Ball Community</h1>
      <p>Site working. Served by Cloudflare Pages.</p>
      <div class="status">Online</div>
    </main>
  </body>
</html>
